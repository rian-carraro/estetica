<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Box Manager — Estética Automotiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #15171B;
  --surface: #1E2126;
  --surface-2: #262A31;
  --line: #2C3038;
  --text: #F2F1ED;
  --text-muted: #9A9FA6;
  --gold: #E8A33D;
  --gold-dim: #6b511f;
  --blue: #3DA5D9;
  --red: #D9534F;
  --green: #5FB86A;
  --radius: 10px;
  --font-display: 'Oswald', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.03em; margin:0;}
.oculto{display:none !important;}
button{font-family:var(--font-body); cursor:pointer;}
input,select,textarea{
  font-family:var(--font-body);
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:6px;
  padding:10px 12px;
  font-size:14px;
  width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
label{font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; display:block; margin:14px 0 6px;}

/* ---------- BOTÕES ---------- */
.btn{
  border:none; border-radius:6px; padding:10px 18px; font-weight:600; font-size:14px;
  transition:transform .1s ease, opacity .15s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--gold); color:#1A1200;}
.btn-primary:hover{opacity:0.9;}
.btn-ghost{background:transparent; border:1px solid var(--line); color:var(--text);}
.btn-ghost:hover{border-color:var(--gold); color:var(--gold);}
.btn-danger{background:transparent; border:1px solid var(--red); color:var(--red);}
.btn-whats{background:#25D366; color:#06210F;}
.btn-sm{padding:6px 12px; font-size:12px; border-radius:5px;}

/* ---------- TELA DE CONFIG ---------- */
.tela-config{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 20% 20%, rgba(232,163,61,0.06), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(61,165,217,0.06), transparent 40%),
    var(--bg);
  padding:20px;
}
.config-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:36px 32px; width:100%; max-width:400px; position:relative;
}
.config-tread{
  position:absolute; top:0; left:32px; right:32px; height:3px;
  background-image:repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 20px);
  border-radius:0 0 4px 4px;
}
.config-card h1{font-size:28px; letter-spacing:0.06em; margin-bottom:4px;}
.config-sub{color:var(--text-muted); font-size:13px; margin:0 0 8px;}
.config-erro{color:var(--red); font-size:13px; min-height:18px;}
.config-ajuda{margin-top:16px; font-size:12px; color:var(--text-muted);}
.config-ajuda summary{cursor:pointer; color:var(--blue);}
.config-ajuda code{background:var(--surface-2); padding:1px 5px; border-radius:3px; font-family:var(--font-mono);}
#cfg-salvar{width:100%; margin-top:20px;}

/* ---------- LAYOUT PRINCIPAL ---------- */
.tela-app{display:flex; min-height:100vh;}
.sidebar{
  width:220px; background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:24px 16px; flex-shrink:0;
}
.logo{display:flex; align-items:center; gap:10px; margin-bottom:32px; padding:0 8px;}
.logo-mark{color:var(--gold); font-size:20px;}
.logo-txt{font-family:var(--font-display); font-size:15px; line-height:1.1; letter-spacing:0.04em;}
.nav{display:flex; flex-direction:column; gap:4px; flex:1;}
.nav-item{
  background:transparent; border:none; color:var(--text-muted); text-align:left;
  padding:11px 12px; border-radius:6px; font-size:14px; font-weight:500;
}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.ativo{background:var(--surface-2); color:var(--gold); font-weight:600;}
.nav-desconectar{
  background:none; border:1px solid var(--line); color:var(--text-muted);
  padding:9px; border-radius:6px; font-size:12px;
}
.nav-desconectar:hover{border-color:var(--red); color:var(--red);}

.conteudo{flex:1; padding:32px 40px; max-width:1100px;}
.tab{display:none;}
.tab.ativo{display:block;}
.tab-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
.eyebrow{color:var(--gold); font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; margin:0 0 4px;}
.tab-header h2{font-size:26px;}

/* ---------- DASHBOARD ---------- */
.grid-dashboard{display:grid; grid-template-columns:1.6fr 1fr; gap:20px;}
.painel-lista, .painel-lateral{display:flex; flex-direction:column; gap:14px;}
.painel-lista h3, .painel-lateral h3{font-size:13px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px;}
.mini-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; display:flex; flex-direction:column; gap:2px;
}
.mini-card.alerta{border-color:var(--gold-dim);}
.mini-num{font-family:var(--font-display); font-size:32px; color:var(--gold);}
.mini-label{font-size:12px; color:var(--text-muted);}
.lista-alertas{display:flex; flex-direction:column; gap:8px;}
.item-alerta{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px; display:flex; justify-content:space-between;}
.item-alerta b{color:var(--red);}

/* ---------- TICKET DE AGENDAMENTO (elemento assinatura) ---------- */
.lista-agendamentos{display:flex; flex-direction:column; gap:14px;}
.ticket{
  position:relative;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:16px 20px 16px 28px;
  display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
}
.ticket::before{
  content:"";
  position:absolute; left:0; top:0; bottom:0; width:14px;
  background-image:radial-gradient(circle, var(--bg) 2.5px, transparent 2.6px);
  background-size:14px 14px; background-position:0 4px;
  border-right:1px dashed var(--line);
}
.ticket-info{display:flex; flex-direction:column; gap:3px;}
.ticket-hora{font-family:var(--font-mono); color:var(--gold); font-size:15px; font-weight:600;}
.ticket-cliente{font-size:15px; font-weight:600;}
.ticket-detalhe{font-size:13px; color:var(--text-muted);}
.ticket-status{
  font-size:11px; text-transform:uppercase; letter-spacing:0.04em; padding:4px 10px; border-radius:20px; font-weight:600;
}
.status-agendado{background:rgba(61,165,217,0.15); color:var(--blue);}
.status-em_andamento{background:rgba(232,163,61,0.15); color:var(--gold);}
.status-concluido{background:rgba(95,184,106,0.15); color:var(--green);}
.status-cancelado{background:rgba(217,83,79,0.15); color:var(--red);}
.ticket-acoes{display:flex; gap:8px; align-items:center;}
.vazio{color:var(--text-muted); font-size:14px; padding:20px 0;}

/* ---------- AGENDA FILTRO ---------- */
.filtro-data{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.filtro-data label{margin:0; font-size:12px;}
.filtro-data input{width:auto;}

/* ---------- CLIENTES ---------- */
.lista-clientes{display:flex; flex-direction:column; gap:12px;}
.cliente-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 20px;}
.cliente-topo{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
.cliente-nome{font-size:16px; font-weight:600;}
.cliente-fone{font-family:var(--font-mono); font-size:13px; color:var(--text-muted);}
.veiculos-mini{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
.veiculo-linha{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--surface-2); border-radius:6px; padding:8px 12px; font-size:13px;
}
.placa{font-family:var(--font-mono); background:var(--bg); padding:2px 8px; border-radius:4px; letter-spacing:0.05em; font-weight:600;}
.link-add{background:none; border:none; color:var(--blue); font-size:12px; text-align:left; padding:4px 0;}

/* ---------- SERVIÇOS ---------- */
.grid-servicos{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px;}
.servico-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px; display:flex; flex-direction:column; gap:8px;}
.servico-nome{font-size:16px; font-weight:600;}
.servico-desc{font-size:13px; color:var(--text-muted); flex:1;}
.servico-meta{display:flex; justify-content:space-between; align-items:center; font-size:13px;}
.servico-preco{font-family:var(--font-mono); color:var(--gold); font-weight:600; font-size:16px;}
.servico-inativo{opacity:0.45;}
.badge-inativo{font-size:10px; text-transform:uppercase; background:var(--surface-2); padding:2px 8px; border-radius:10px; color:var(--text-muted); align-self:flex-start;}

/* ---------- ESTOQUE ---------- */
.filtro-categoria{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.filtro-chip{
  background:var(--surface); border:1px solid var(--line); color:var(--text-muted);
  padding:6px 14px; border-radius:20px; font-size:12px;
}
.filtro-chip.ativo{border-color:var(--gold); color:var(--gold);}
.grid-produtos{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
.produto-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column;}
.produto-foto{width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:12px;}
.produto-corpo{padding:14px; display:flex; flex-direction:column; gap:6px;}
.produto-nome{font-weight:600; font-size:15px;}
.produto-cat{font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:0.04em;}
.produto-cor-tag{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted);}
.dot-cor{width:10px; height:10px; border-radius:50%; border:1px solid rgba(255,255,255,0.3); display:inline-block;}
.produto-uso{font-size:12px; color:var(--text-muted); line-height:1.4;}
.produto-qtd{font-family:var(--font-mono); font-size:14px; margin-top:4px;}
.produto-qtd.baixo{color:var(--red); font-weight:600;}
.produto-acoes{display:flex; gap:8px; padding:0 14px 14px; margin-top:auto;}

/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,11,13,0.75); backdrop-filter:blur(2px);
  display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;
}
.modal-box{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:28px; width:100%; max-width:480px; margin-top:20px;
}
.modal-box h3{font-size:20px; margin-bottom:4px;}
.modal-sub{color:var(--text-muted); font-size:13px; margin:0 0 10px;}
.modal-acoes{display:flex; justify-content:flex-end; gap:10px; margin-top:22px;}
.modal-foto-preview{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:8px; margin-top:8px; background:var(--surface-2);}
.linha-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

/* ---------- TOAST ---------- */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--surface-2); border:1px solid var(--gold); color:var(--text);
  padding:12px 20px; border-radius:8px; font-size:14px; z-index:100;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
}

/* ---------- RESPONSIVO ---------- */
@media (max-width:880px){
  .tela-app{flex-direction:column;}
  .sidebar{width:100%; flex-direction:row; align-items:center; padding:14px 16px; overflow-x:auto;}
  .logo{margin-bottom:0;}
  .nav{flex-direction:row;}
  .nav-desconectar{white-space:nowrap;}
  .conteudo{padding:24px 18px;}
  .grid-dashboard{grid-template-columns:1fr;}
  .linha-2{grid-template-columns:1fr;}
}

</style>
</head>
<body>

<div id="app">

  <!-- APP PRINCIPAL -->
  <div id="tela-app" class="tela-app">
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-mark">●</span>
        <span class="logo-txt">BOX<br/>MANAGER</span>
      </div>
      <nav class="nav">
        <button class="nav-item ativo" data-tab="dashboard">Painel</button>
        <button class="nav-item" data-tab="agenda">Agenda</button>
        <button class="nav-item" data-tab="clientes">Clientes &amp; Veículos</button>
        <button class="nav-item" data-tab="servicos">Serviços</button>
        <button class="nav-item" data-tab="estoque">Estoque</button>
      </nav>
    </aside>

    <main class="conteudo">

      <!-- DASHBOARD -->
      <section id="tab-dashboard" class="tab ativo">
        <header class="tab-header">
          <div>
            <p class="eyebrow">Hoje / <span id="data-hoje"></span></p>
            <h2>Painel do dia</h2>
          </div>
        </header>
        <div class="grid-dashboard">
          <div class="painel-lista">
            <h3>Agenda de hoje</h3>
            <div id="lista-hoje" class="lista-agendamentos"></div>
          </div>
          <div class="painel-lateral">
            <div class="mini-card">
              <span class="mini-num" id="num-hoje">0</span>
              <span class="mini-label">agendamentos hoje</span>
            </div>
            <div class="mini-card alerta">
              <span class="mini-num" id="num-estoque-baixo">0</span>
              <span class="mini-label">itens com estoque baixo</span>
            </div>
            <div id="lista-estoque-baixo" class="lista-alertas"></div>
          </div>
        </div>
      </section>

      <!-- AGENDA -->
      <section id="tab-agenda" class="tab">
        <header class="tab-header">
          <div>
            <p class="eyebrow">Ordens de serviço</p>
            <h2>Agenda</h2>
          </div>
          <button class="btn btn-primary" id="btn-novo-agendamento">+ Novo agendamento</button>
        </header>
        <div class="filtro-data">
          <label>Ver dia:</label>
          <input type="date" id="filtro-data-agenda" />
          <button class="btn btn-ghost" id="btn-todos-agendamentos">Ver todos</button>
        </div>
        <div id="lista-agenda-completa" class="lista-agendamentos"></div>
      </section>

      <!-- CLIENTES & VEÍCULOS -->
      <section id="tab-clientes" class="tab">
        <header class="tab-header">
          <div>
            <p class="eyebrow">Cadastro</p>
            <h2>Clientes &amp; Veículos</h2>
          </div>
          <button class="btn btn-primary" id="btn-novo-cliente">+ Novo cliente</button>
        </header>
        <div id="lista-clientes" class="lista-clientes"></div>
      </section>

      <!-- SERVIÇOS -->
      <section id="tab-servicos" class="tab">
        <header class="tab-header">
          <div>
            <p class="eyebrow">Catálogo</p>
            <h2>Serviços</h2>
          </div>
          <button class="btn btn-primary" id="btn-novo-servico">+ Novo serviço</button>
        </header>
        <div id="lista-servicos" class="grid-servicos"></div>
      </section>

      <!-- ESTOQUE -->
      <section id="tab-estoque" class="tab">
        <header class="tab-header">
          <div>
            <p class="eyebrow">Produtos &amp; toalhas</p>
            <h2>Estoque</h2>
          </div>
          <button class="btn btn-primary" id="btn-novo-produto">+ Novo produto</button>
        </header>
        <div class="filtro-categoria" id="filtro-categoria"></div>
        <div id="lista-produtos" class="grid-produtos"></div>
      </section>

    </main>
  </div>
</div>

<!-- MODAIS -->
<div id="modal-overlay" class="modal-overlay oculto">
  <div id="modal-box" class="modal-box"></div>
</div>

<div id="toast" class="toast oculto"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   BOX MANAGER — lógica do sistema
   ========================================================= */

let sb = null;

/* ---------- CONEXÃO COM SUPABASE ---------- */
const SUPABASE_URL = 'https://djwgrdugpirgubjynoih.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YnyyjQKnO2Euf7E-9BPwPA_l4bAKFPv';

async function iniciarConexao(){
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { error } = await sb.from('servicos').select('id').limit(1);
    if(error) throw error;
    carregarTudo();
  }catch(e){
    toast('Não foi possível conectar ao banco. Confira se o schema.sql foi executado no Supabase. (' + (e.message||'erro') + ')');
  }
}

/* ---------- NAVEGAÇÃO ---------- */
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('ativo'));
    btn.classList.add('ativo');
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
    document.getElementById('tab-'+btn.dataset.tab).classList.add('ativo');
  });
});

/* ---------- HELPERS ---------- */
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('oculto');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>el.classList.add('oculto'), 3000);
}

function fecharModal(){
  document.getElementById('modal-overlay').classList.add('oculto');
  document.getElementById('modal-box').innerHTML = '';
}
document.getElementById('modal-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modal-overlay') fecharModal();
});

function abrirModal(html){
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('oculto');
}

function formatarData(d){
  const [ano,mes,dia] = d.split('-');
  return `${dia}/${mes}/${ano}`;
}
function formatarHora(h){
  return h ? h.substring(0,5) : '';
}
function hojeISO(){
  const d = new Date();
  return d.toISOString().split('T')[0];
}
function escapeHtml(str){
  if(str===null || str===undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- CACHE LOCAL (para montar selects/relacionamentos) ---------- */
let cacheClientes = [];
let cacheVeiculos = [];
let cacheServicos = [];
let cacheProdutos = [];

async function carregarTudo(){
  document.getElementById('data-hoje').textContent = formatarData(hojeISO());
  document.getElementById('filtro-data-agenda').value = hojeISO();
  await Promise.all([carregarClientes(), carregarServicos(), carregarProdutos()]);
  await carregarAgendamentos();
  renderDashboard();
}

/* =========================================================
   CLIENTES & VEÍCULOS
   ========================================================= */
async function carregarClientes(){
  const { data: clientes, error } = await sb.from('clientes').select('*').order('nome');
  if(error){ toast('Erro ao carregar clientes'); return; }
  cacheClientes = clientes || [];
  const { data: veiculos } = await sb.from('veiculos').select('*');
  cacheVeiculos = veiculos || [];
  renderClientes();
}

function renderClientes(){
  const box = document.getElementById('lista-clientes');
  if(cacheClientes.length === 0){
    box.innerHTML = '<p class="vazio">Nenhum cliente cadastrado ainda. Clique em "+ Novo cliente".</p>';
    return;
  }
  box.innerHTML = cacheClientes.map(c=>{
    const veic = cacheVeiculos.filter(v=>v.cliente_id === c.id);
    return `
    <div class="cliente-card">
      <div class="cliente-topo">
        <div>
          <div class="cliente-nome">${escapeHtml(c.nome)}</div>
          <div class="cliente-fone">${escapeHtml(c.telefone)}</div>
        </div>
        <div class="ticket-acoes">
          <button class="btn btn-ghost btn-sm" onclick="editarCliente('${c.id}')">Editar</button>
          <button class="btn btn-danger btn-sm" onclick="removerCliente('${c.id}')">Excluir</button>
        </div>
      </div>
      <div class="veiculos-mini">
        ${veic.map(v=>`
          <div class="veiculo-linha">
            <span><span class="placa">${escapeHtml(v.placa)}</span> ${escapeHtml(v.marca||'')} ${escapeHtml(v.modelo||'')} ${v.cor?('· '+escapeHtml(v.cor)):''}</span>
            <span>
              <button class="link-add" onclick="editarVeiculo('${v.id}','${c.id}')">editar</button>
              <button class="link-add" onclick="removerVeiculo('${v.id}')">excluir</button>
            </span>
          </div>`).join('')}
        <button class="link-add" onclick="abrirModalVeiculo(null, '${c.id}')">+ adicionar veículo</button>
      </div>
    </div>`;
  }).join('');
}

  const fotoInput = document.getElementById('m-foto');
  if(!nome){ toast('Informe o nome do produto'); return; }

  const btn = document.getElementById('btn-salvar-produto');
  btn.textContent = 'Salvando...';
  btn.disabled = true;

  let foto_url = id ? (cacheProdutos.find(x=>x.id===id)?.foto_url || null) : null;
  const arquivo = fotoInput.files[0];
  if(arquivo){
    const nomeArquivo = `${Date.now()}_${arquivo.name}`.replace(/\s+/g,'_');
    const { error: erroUpload } = await sb.storage.from('produtos').upload(nomeArquivo, arquivo, {upsert:true});
    if(erroUpload){
      toast('Erro ao enviar foto: ' + erroUpload.message);
    }else{
      const { data: pub } = sb.storage.from('produtos').getPublicUrl(nomeArquivo);
      foto_url = pub.publicUrl;
    }
  }

  const payload = {nome, categoria, cor, uso, quantidade, unidade, quantidade_minima, foto_url};
  let error;
  if(id){
    ({error} = await sb.from('produtos').update(payload).eq('id', id));
  }else{
    ({error} = await sb.from('produtos').insert(payload));
  }
  if(error){ toast('Erro ao salvar produto'); btn.textContent='Salvar'; btn.disabled=false; return; }
  fecharModal();
  toast('Produto salvo!');
  carregarProdutos();
}
window.salvarProduto = salvarProduto;

async function removerProduto(id){
  if(!confirm('Excluir este produto do estoque?')) return;
  const { error } = await sb.from('produtos').delete().eq('id', id);
  if(error){ toast('Erro ao excluir'); return; }
  toast('Produto excluído');
  carregarProdutos();
}
window.removerProduto = removerProduto;

function abrirModalMovimentacao(produtoId){
  const p = cacheProdutos.find(x=>x.id===produtoId);
  abrirModal(`
    <h3>Movimentar estoque</h3>
    <p class="modal-sub">${escapeHtml(p.nome)} — atual: ${p.quantidade} ${escapeHtml(p.unidade)}</p>
    <label>Tipo</label>
    <select id="m-tipo">
      <option value="entrada">Entrada (compra/reposição)</option>
      <option value="saida">Saída (uso/consumo)</option>
    </select>
    <label>Quantidade</label>
    <input id="m-qtd-mov" type="number" step="0.01" value="1" />
    <label>Observação</label>
    <input id="m-obs-mov" placeholder="Ex: usado no serviço de hoje" />
    <div class="modal-acoes">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarMovimentacao('${produtoId}')">Confirmar</button>
    </div>
  `);
}
window.abrirModalMovimentacao = abrirModalMovimentacao;

async function salvarMovimentacao(produtoId){
  const p = cacheProdutos.find(x=>x.id===produtoId);
  const tipo = document.getElementById('m-tipo').value;
  const qtd = parseFloat(document.getElementById('m-qtd-mov').value)||0;
  const obs = document.getElementById('m-obs-mov').value.trim();
  if(qtd<=0){ toast('Informe uma quantidade válida'); return; }

  const novaQtd = tipo==='entrada' ? Number(p.quantidade)+qtd : Number(p.quantidade)-qtd;
  if(novaQtd < 0){ toast('Estoque não pode ficar negativo'); return; }

  const { error: e1 } = await sb.from('produtos').update({quantidade: novaQtd}).eq('id', produtoId);
  const { error: e2 } = await sb.from('movimentacoes_estoque').insert({produto_id: produtoId, tipo, quantidade: qtd, observacao: obs});
  if(e1 || e2){ toast('Erro ao registrar movimentação'); return; }
  fecharModal();
  toast('Estoque atualizado!');
  carregarProdutos();
}
window.salvarMovimentacao = salvarMovimentacao;

/* ---------- START ---------- */
iniciarConexao();

</script>
